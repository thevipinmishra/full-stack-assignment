services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lead_intake
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_intake"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lead-intake-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/server.js"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@database:5432/lead_intake
      PORT: 3001
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-local-demo-verify-token}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-local-demo-secret}
    ports:
      - "127.0.0.1:3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      API_HOST: api
      API_PORT: 3001
      PORT: 8080
    ports:
      - "127.0.0.1:3000:8080"

volumes:
  lead-intake-data:
